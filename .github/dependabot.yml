version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # Payload's packages must stay on the same version.
      payload:
        patterns: ["payload", "@payloadcms/*"]
      # react-dom requires the exact same react version.
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
    ignore:
      # TypeScript majors change the compiler itself; upgrade them by hand.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # eslint-config-next's react, import and jsx-a11y plugins only support ESLint up to 9.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
